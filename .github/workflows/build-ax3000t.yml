name: Build Xiaomi AX3000T Firmware

on:
  workflow_dispatch:
    inputs:
      config_type:
        description: '固件配置类型 (Configuration Type)'
        required: true
        default: 'current'
        type: choice
        options:
          - 'current'
          - 'official'
      upload_release:
        description: '是否发布到 GitHub Releases (Upload to Releases)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出仓库代码 (Checkout)
      uses: actions/checkout@v4

    - name: 释放 Runner 磁盘空间 (Free Disk Space)
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -a -f || true
        sudo df -h

    - name: 安装编译依赖 (Install Build Dependencies)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison \
          build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
          gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
          libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full \
          patch pkgconf python3 python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: 更新并安装 Feeds (Update & Install Feeds)
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 应用设备与插件配置 (Apply Configuration)
      run: |
        if [ "${{ github.event.inputs.config_type }}" = "official" ]; then
          echo "Using author official defconfig: mt7981-ax3000.config"
          cp -f defconfig/mt7981-ax3000.config .config
        else
          echo "Using current router 1:1 config: ax3000t-current.config"
          cp -f defconfig/ax3000t-current.config .config
        fi
        make defconfig

    - name: 下载软件包源码 (Download Packages)
      id: download
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 多核编译固件 (Compile Firmware)
      id: compile
      run: |
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "BUILD_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV

    - name: 收集与整理固件产物 (Organize Firmware)
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        mkdir -p /tmp/firmware
        cd bin/targets/mediatek/mt7981/
        cp -f immortalwrt-mediatek-mt7981-xiaomi_mi-router-ax3000t* /tmp/firmware/ 2>/dev/null || cp -f *sysupgrade.bin /tmp/firmware/ 2>/dev/null || cp -f *ax3000t* /tmp/firmware/
        cd /tmp/firmware
        sha256sum * > sha256sums.txt
        echo "FIRMWARE_PATH=/tmp/firmware" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        ls -lh /tmp/firmware

    - name: 上传构建产物 (Upload Artifact)
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: ImmortalWrt_AX3000T_${{ env.BUILD_DATE }}
        path: ${{ env.FIRMWARE_PATH }}/*

    - name: 发布到 GitHub Releases (Create Release)
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && github.event.inputs.upload_release == 'true'
      with:
        tag_name: AX3000T-${{ env.BUILD_DATE }}
        name: Xiaomi AX3000T ImmortalWrt Firmware (${{ env.BUILD_DATE }})
        body: |
          ### 小米 AX3000T 固件编译完成
          - **源码仓库**: [hanwckf/immortalwrt-mt798x](https://github.com/hanwckf/immortalwrt-mt798x)
          - **分支**: `openwrt-21.02` (内核 5.4)
          - **驱动**: MediaTek 原厂闭源 `mt_wifi` 驱动 (带 HNAT/PPE 硬件加速)
          - **配置模式**: `${{ github.event.inputs.config_type }}`
          - **构建日期**: ${{ env.BUILD_DATE }}

          #### 刷机说明：
          1. 已经在运行 ImmortalWrt 的路由器，请下载 `*sysupgrade.bin` 文件；
          2. 进入路由器后台：**系统 -> 备份/升级 -> 刷写新的固件**，上传该文件即可平滑升级。
        files: ${{ env.FIRMWARE_PATH }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
